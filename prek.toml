# Configuration file for `prek`, a git hook framework written in Rust.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "no-commit-to-branch" },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e"  # frozen: v8.30.1
hooks = [{ id = "gitleaks" }]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "e8f7d69b957a30acb2c875078d5fd012de24b64c"  # frozen: v0.16.7
hooks = [
  { id = "ruff-check", args = ["--fix"] },
  { id = "ruff-format" }
]

[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "24cb944c372f536967c7f09b62552e7221f84363" # frozen: v0.0.81
hooks = [
  { id = "ty", args = ["--no-default-groups"] },
]
