[project]
name = "anti-fwd-spam"
version = "0.1.0"
description = "Telegram provenance filter for Cloudflare Python Workers"
requires-python = ">=3.13,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "ruff==0.16.8",
  "workers-py==1.17.3",
  "workers-runtime-sdk==1.8.4",
]

[[tool.uv.index]]
url = "https://pypi.flatt.tech/simple/"
default = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # The project has no copyright-header policy.
  "CPY001",
  # These docstring and whitespace rules conflict with Ruff's formatter.
  "W191",
  "E111",
  "E114",
  "E117",
  "D203",
  "D206",
  "D300",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "Q004",
  "COM812",
  "COM819",
]
preview = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  # Acceptance scenarios use assertions, fixed values and dummy credentials.
  "S101",
  "S106",
  "PLR2004",
  # BDD descriptions belong on test methods, not every fake/helper.
  "D100",
  "D101",
  "D102",
  "D103",
  "D107",
  # The stalled transport accepts the same arguments as Workers fetch.
  "ANN001",
  "ARG001",
  # Native Python checks use stdlib unittest.
  "PT009",
  "PT027",
]
